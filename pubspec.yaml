name: nexora_app
description: دفتر الحسابات — سجل الديون والحسابات
publish_to: 'none'
version: 4.7.0+315

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: '>=2.2.0 <3.0.0'
  intl: '>=0.19.0 <1.0.0'
  url_launcher: ^6.3.0
  http: ^1.2.2
  share_plus: ^10.0.2
  # (2026-11-22) أُزيلت file_picker و sqflite_common_ffi: غير مستخدمتين في
  # lib/ إطلاقاً، وكانتا تجرّان مكتبات أصلية تُثقل كل حزمة APK.
  image_picker: ^1.1.2
  pdf: ^3.11.1
  open_filex: ^4.5.0
  math_expressions: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/audio/
  fonts:
    - family: AppNaskh
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
