plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.nexora.eradata"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.nexora.eradata"
        minSdk = 24
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
        // (3.70) حزمة شاملة Universal — كل معالجات أندرويد المدعومة
        // (armeabi-v7a + arm64-v8a + x86_64): إنهاء خطأ «الحزمة تبدو
        // غير صالحة» على الأجهزة غير arm64. لا فلترة ABI بعد اليوم.
    }

    // (2026-11-22) ضغط المكتبات الأصلية داخل APK.
    // useLegacyPackaging=false يخزّن libflutter.so (10.5MB) وlibapp.so (7.75MB)
    // دون ضغط (page-aligned) فتبلغ الحزمة 22.4MB. مع true تُضغط داخل APK
    // (~13MB) ويستخرجها النظام عند التثبيت. الفرق: تنزيل أصغر، تثبيت أبطأ قليلاً.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                storeType = keystoreProperties.getProperty('storeType', 'PKCS12')
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            // توقيع ثابت إلزامي للإصدارات: إذا غاب المفتاح نُفشل البناء بدل
            // التوقيع بمفتاح debug مؤقت (الذي يكسر التحديث فوق نسخة مثبّتة).
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException(
                    "توقيع release مفقود: أضف android/key.properties (أو سرّ ANDROID_KEYSTORE_BASE64 في CI). " +
                    "التوقيع بمفتاح debug يمنع تثبيت التحديث فوق النسخة السابقة.")
            }
            signingConfig = signingConfigs.release
            // (2026-11-22) تفعيل R8: تعطيله أبقى كل رموز المكتبات داخل الحزمة
            // فبلغت 25-28MB وتجاوزت حدّ 20MB. القواعد في proguard-rules.pro.
            minifyEnabled = true
            shrinkResources = true
            // إبقاء أسماء الأصناف المطلوبة عبر الانعكاس (Flutter + الإضافات).
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

// تعطيل lint: يتعارض إصداره مع AGP 9 في هذه البيئة (NoSuchMethodError)
// ولا يؤثر على مخرجات البناء.
tasks.configureEach { task ->
    if (task.name.toLowerCase().contains("lint")) {
        task.enabled = false
    }
}

dependencies {
    implementation "com.google.android.material:material:1.12.0"
}
